[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "TUI dashboard watching opencode sessions across projects. Skeleton only — see docs/specs/dashboard/overview.md for the design later M3 tasks fill in."
publish = false

[dependencies]
opencode-client = { path = "../opencode-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
serde_json = "1"
# T11: Mosaic layout/render, ported from the verified spike
# (tmp/20260901-prototype-dashboard-layout/), which pinned this same "0.28"
# version. First and only TUI dependency in this workspace (R1.1) — belongs
# only in this crate, never in opencode-client.
ratatui = "0.28"
