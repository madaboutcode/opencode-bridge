name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --all-targets --locked

      - name: cargo package --list (no internal docs)
        run: cargo package --locked --allow-dirty --no-verify --list | tee /tmp/pkg-list.txt && ! grep -Eq "docs/internal|tasks/" /tmp/pkg-list.txt

      - name: MSRV check (Cargo.toml rust-version)
        run: cargo metadata --format-version=1 --no-deps | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['packages'][0]['rust_version']; assert v=='1.75', f\"rust-version mismatch: {v}\"; print(f\"MSRV {v} OK\")"
