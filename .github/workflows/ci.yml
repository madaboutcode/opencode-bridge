name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Check SemVer tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

  check:
    needs: validate-tag
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

      - name: cargo package --list (no internal docs)
        # opencode-bridge is the only published crate — a bare `cargo
        # package` doesn't resolve to a single crate in a workspace, so
        # scope it explicitly. This is the crate whose exclude list keeps
        # docs/internal/ and tasks/ out of the crates.io tarball.
        run: |
          cargo package --locked --no-verify --list -p opencode-bridge | tee /tmp/pkg-list.txt
          if grep -Eq "docs/internal|tasks/" /tmp/pkg-list.txt; then
            echo "Internal files found in package"
            exit 1
          fi

      - name: MSRV check (Cargo.toml rust-version)
        run: |
          cargo metadata --format-version=1 --no-deps | python3 -c 'import json,sys; d=json.load(sys.stdin); v=next(p for p in d["packages"] if p["name"]=="opencode-bridge")["rust_version"]; assert v=="1.75", f"rust-version mismatch: {v}"; print(f"MSRV {v} OK")'

      - name: Build release binary
        run: cargo build --release --locked

      - name: Determine target triple
        id: target
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Name release binary
        env:
          TAG: ${{ github.ref_name }}
        run: cp target/release/opencode-bridge "opencode-bridge-${TAG}-${{ steps.target.outputs.target }}"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-bridge-${{ steps.target.outputs.target }}
          path: opencode-bridge-${{ github.ref_name }}-${{ steps.target.outputs.target }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
